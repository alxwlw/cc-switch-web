upstream_repository = "farion1231/cc-switch"
upstream_tag = "v4.0.36"
upstream_commit = "fa4a23700e92a3b964650f3039f897b3137b3e2b"
forked_at = "2026-10-24"
last_sync = "2026-11-20: merged fa4a2370 (v4.0.36) into main; added web routes for the new Plugins page (/api/plugins/:app/*)"

# Branch policy (mirrors xiaoY233/cc-switch-remote):
# - `upstream-main`: clean mirror of upstream, fast-forward only.
# - `main`: product branch. Keep fork-specific code behind adapters
#   (src-tauri/src/web_api/, examples/server.rs, scripts/deploy-*)
#   so upstream merges stay mechanical.
product_branch = "main"
mirror_branch = "upstream-main"

# Fork-owned paths: after a merge of upstream, scripts/sync-upstream.sh puts them back to the
# fork's version (and removes the ones the fork does not have). `*` matches any characters, `/` too.
fork_owned = [
  "README.md",
  "README_*.md",
  "SECURITY.md",
  "SUPPORT.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "CHANGELOG.md",
  "LICENSE",
  "docs/deploy.md",
  "tests/config/readmeParity.test.ts",
  ".github/*",
]

# Sync cadence: every 2-4 weeks.
# 1. scripts/sync-upstream.sh [--ref <upstream-ref>]: fetches upstream, moves `upstream-main`
#    (ff-only), starts sync/upstream-<sha> from main, merges without committing and restores the
#    fork-owned paths above; exit 2 means code conflicts are left to resolve by hand.
# 2. resolve the reported conflicts only in code, review `kept fork version` lines, commit
# 3. cargo test + stream-check. A sync is never tagged: a release tag (v<upstream>-web.<N>) is
#    set only after the owner's explicit go-ahead, because a v*-web.* tag publishes a release
#    that every self-updating install takes
