name: Bug report
description: Something in cc-switch-web does not work as expected.
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings → About.
      placeholder: "e.g. v4.0.35-web.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options:
        - install.sh
        - Docker Compose
        - built from source
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: "e.g. Ubuntu 24.04"
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent involved
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help most.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        For a systemd install run `journalctl --user -u cc-switch-web -n 100`;
        for Docker Compose run `docker compose logs`. Remove tokens and API keys before pasting.
      render: shell
