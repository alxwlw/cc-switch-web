name: Scripts

# The bash suites of scripts/tests. No path filter on purpose: it is light, and it also has to
# catch a pull request that only touches documents (the upstream-traces check is a *.test.sh too).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Bash tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run scripts/tests/*.test.sh
        run: |
          shopt -s nullglob
          tests=(scripts/tests/*.test.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "no scripts/tests/*.test.sh found" >&2
            exit 1
          fi
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! bash "$t"; then
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed: ${failed[*]}" >&2
            exit 1
          fi
          echo "all ${#tests[@]} suites passed"
