name: Release (web)

# Builds the web console server for Linux (x86_64, aarch64), smoke-tests the archives by
# installing them in clean distro containers and, on a v<upstream>-web.<n> tag, publishes the
# GitHub release. Pull requests and manual runs build and test but never publish: only the push
# of a tag publishes (scripts/release-meta.sh).
on:
  push:
    tags: ["v*-web.*"]
  pull_request:
    branches: [main]
    paths:
      # every input of the archive and of the image
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - "vite.config.web.mts"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "deploy/**"
      - "Dockerfile.web"
      - "Dockerfile.web.dockerignore"
      - ".github/workflows/release-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  scripts:
    name: Bash tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run scripts/tests/*.test.sh
        run: bash scripts/tests/run-all.sh

  meta:
    name: Version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Work out the tag and the version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/release-meta.sh | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: meta
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml is the only source of the compiler version, as in ci.yml
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      # Dependencies only; only main saves, as in ci.yml
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: release-web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # pnpm comes from the packageManager field, installed with npm as Dockerfile.web does
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Build the console
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web

      - name: Build the server
        env:
          CC_SWITCH_WEB_GIT_SHA: ${{ github.sha }}
          CC_SWITCH_WEB_VERSION: ${{ env.VERSION }}
        run: |
          mkdir -p dist
          cargo build --release --example server --manifest-path src-tauri/Cargo.toml

      - name: Package the archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/package-release.sh "$TAG" "$ARCH" \
            src-tauri/target/release/examples/server dist-web out
          ls -l out

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [meta, build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, image: "debian:12", arch: x86_64 }
          - { os: ubuntu-latest, image: "ubuntu:22.04", arch: x86_64 }
          - { os: ubuntu-latest, image: "ubuntu:24.04", arch: x86_64 }
          - { os: ubuntu-22.04-arm, image: "ubuntu:24.04", arch: aarch64 }
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/${{ needs.meta.outputs.tag }}

      - name: Write SHA256SUMS
        run: |
          cd "artifacts/$TAG"
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS

      - name: Install and run in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" "$IMAGE" bash /w/scripts/tests/smoke-in-container.sh "$TAG"

  docker:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: meta
    timeout-minutes: 90
    # packages: write is for the push by digest, which only runs on a release tag; a pull request
    # run never logs in to ghcr.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { os: ubuntu-22.04-arm, platform: linux/arm64, arch: arm64 }
    env:
      IMAGE: ghcr.io/alxwlw/cc-switch-web
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once and loaded into the local daemon; the smoke test runs on exactly this image.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          load: true
          tags: cc-switch-web:ci
          build-args: |
            CC_SWITCH_WEB_GIT_SHA=${{ github.sha }}
            CC_SWITCH_WEB_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Smoke-test deploy/compose.yml with the image
        run: bash scripts/tests/compose-smoke.sh cc-switch-web:ci "$VERSION"

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build, every layer from the cache; only the digest is pushed, the tags go on in docker-manifest.
      - name: Push the image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          build-args: |
            CC_SWITCH_WEB_GIT_SHA=${{ github.sha }}
            CC_SWITCH_WEB_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "the push step returned no digest" >&2; exit 1; }
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  docker-manifest:
    name: Image tags
    runs-on: ubuntu-latest
    needs: [meta, scripts, build, smoke, docker]
    if: needs.meta.outputs.publish == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/alxwlw/cc-switch-web
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        working-directory: digests
        run: |
          set -euo pipefail
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "expected 2 digests (amd64, arm64), found: ${sources[*]}" >&2; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [meta, scripts, build, smoke, docker-manifest]
    if: needs.meta.outputs.publish == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Checksums, installer and notes
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
          cd ..
          bash scripts/package-release.sh --installer "$TAG" dist-release/install.sh
          awk -v h="## v$VERSION" '
            index($0, h) == 1 { rest = substr($0, length(h) + 1); if (rest == "" || rest !~ /^[0-9]/) { f = 1; next } }
            /^## / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md section '## v$VERSION' is empty" >&2
            exit 1
          fi
          ls -l dist-release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest \
            dist-release/*.tar.gz dist-release/SHA256SUMS dist-release/install.sh
