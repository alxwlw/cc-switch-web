name: Close Schema Version PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    if: |
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - name: Close if SCHEMA_VERSION is changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: |
            Thanks for your contribution!

            This PR changes the database version `SCHEMA_VERSION`. Migrations can't be rolled back once released, and parallel PRs claiming the same version number conflict with each other, so the version is assigned by maintainers and PRs like this are closed automatically (see the [contributing guide](https://github.com/alxwlw/cc-switch-web/blob/main/CONTRIBUTING.md)). This is not a judgement on your idea.

            If your change really needs a schema change, please reply below, mention the maintainer (`@alxwlw`) and explain why; we'll reopen it if appropriate.
        run: |
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].patch' \
            | grep -qE '^\+.*const SCHEMA_VERSION' || exit 0

          gh pr close "$PR" --comment "$BODY"
